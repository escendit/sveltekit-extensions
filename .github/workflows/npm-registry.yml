name: "npm"

on:
  workflow_run:
    workflows:
      - "Release"
    types:
      - completed
permissions:
  contents: read
  id-token: write
jobs:
  pack:
    if: ${{ github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success' }}
    name: "Pack"
    runs-on: ubuntu-latest
    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # npm Trusted Publishing (OIDC) requires npm CLI >=11.5.1 and Node >=22.14.0
      # (https://docs.npmjs.com/trusted-publishers/). ubuntu-latest's preinstalled Node/npm
      # aren't guaranteed to meet that floor, so pin it explicitly rather than relying on
      # whatever the runner image happens to ship - Bun (below) still does the actual
      # install/build/publish work, this only guarantees a new-enough npm CLI is on PATH
      # for Lerna's OIDC token exchange.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ">=22.14.0"
      # Setup Bun
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # Install dependencies
      - name: Install dependencies
        run: bun install
      # Set Version
      - name: Set TAG variable
        run: |
          echo "Full ref: ${{ github.event.workflow_run.head_branch }}"
          echo "TAG=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_ENV
      - name: Set VERSION variable
        run: echo "VERSION=${TAG#v}" >> $GITHUB_ENV
      - name: Set Version
        run: bunx lerna version $VERSION --no-private --no-git-tag-version --yes
      # Authentication is via npm Trusted Publishing (OIDC) - the id-token: write
      # permission above lets Lerna (v9+, has built-in OIDC support) exchange a
      # GitHub Actions identity token for a short-lived publish credential, so no
      # NPM_TOKEN secret or .npmrc auth line is needed. Each published package must
      # have this workflow configured as its Trusted Publisher on npmjs.com first
      # (package Settings -> Trusted Publisher -> GitHub Actions).
      # Publish
      - name: Setup Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
      - name: Temp Commit
        run: git commit -am "Temp Commit $VERSION"
      - name: Publish
        run: bunx lerna publish from-package --yes
